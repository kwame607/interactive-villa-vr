<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>PS/CSC/22/0173 - Interactive Villa VR</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { font-family: system-ui, sans-serif; }
    a-scene { width: 100%; height: 100%; }
    #mobile-controls {
      display: none; position: fixed; inset: 0; z-index: 9999;
      pointer-events: none; touch-action: none; user-select: none;
    }
    #joystick-zone {
      position: absolute; left: 22px; bottom: 28px; width: 132px; height: 132px;
      border: 2px solid #ffffffaa; border-radius: 50%; background: #10182877;
      box-sizing: border-box; pointer-events: auto; touch-action: none;
    }
    #joystick-knob {
      position: absolute; left: 41px; top: 41px; width: 46px; height: 46px;
      border-radius: 50%; background: #ffffffdf; box-shadow: 0 2px 10px #0008;
      pointer-events: none;
    }
    /* Dedicated touch target: the full-screen parent ignores pointer events. */
    #look-zone {
      position: absolute; left: 50%; right: 0; top: 0; bottom: 0;
      pointer-events: auto; touch-action: none;
    }
    #look-hint {
      position: absolute; right: 12px; bottom: 24px; color: white;
      background: #10182899; border-radius: 10px; padding: 10px 12px;
      font-size: 12px; max-width: 130px; text-align: center;
      pointer-events: none;
    }
    #loading-note {
      position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%);
      color: white; background: #0009; padding: 7px 10px; border-radius: 8px;
      font: 12px system-ui, sans-serif; z-index: 10000; pointer-events: none;
    }
    @media (max-width: 900px), (pointer: coarse) {
      #mobile-controls { display: block; }
      #loading-note { bottom: 172px; }
    }
  </style>

  <script>
    AFRAME.registerComponent('smooth-teleport', {
      schema: { to: { type: 'vec3' } },
      init: function () {
        this.el.addEventListener('click', () => {
          const rig = document.querySelector('#rig');
          const fade = document.querySelector('#fade');
          if (!rig || !fade) return;
          fade.setAttribute('animation', {
            property: 'material.opacity', from: 0, to: 1, dur: 180
          });
          window.setTimeout(() => {
            rig.object3D.position.copy(this.data.to);
            fade.setAttribute('animation', {
              property: 'material.opacity', from: 1, to: 0, dur: 220
            });
          }, 180);
        });
      }
    });

    // Optional proximity teleport. Disabled unless explicitly added to an entity.
    AFRAME.registerComponent('auto-teleport', {
      schema: { to: { type: 'vec3' } },
      init: function () { this.cooldown = 0; },
      tick: function (time, delta) {
        if (this.cooldown > time) return;
        const rig = document.querySelector('#rig');
        if (!rig) return;
        const d = rig.object3D.position.distanceTo(this.el.object3D.position);
        if (d < 1.5) {
          rig.object3D.position.copy(this.data.to);
          this.cooldown = time + 1200;
        }
      }
    });

    // Mobile: left virtual joystick to move; drag anywhere on the right to look.
    // Desktop: keep A-Frame Extras keyboard/mouse movement and look controls.
    AFRAME.registerComponent('villa-mobile-controls', {
      schema: { speed: { default: 5 } },
      init: function () {
        this.rig = this.el;
        this.cameraEl = document.querySelector('#camera');
        this.mobile = window.matchMedia('(max-width: 900px), (pointer: coarse)').matches;
        this.moveX = 0;
        this.moveY = 0;
        this.yaw = 0;
        this.pitch = 0;
        this.joystickId = null;
        this.lookId = null;
        this.lastX = 0;
        this.lastY = 0;

        if (!this.mobile) return;

        // Disable the default look handler on mobile to prevent competing rotations.
        if (this.cameraEl) {
          this.cameraEl.setAttribute('look-controls', 'enabled: false');
          this.cameraEl.object3D.rotation.set(0, 0, 0);
        }

        this.buildUI();
        this.onResize = () => {
          this.mobile = window.matchMedia('(max-width: 900px), (pointer: coarse)').matches;
          if (this.ui) this.ui.style.display = this.mobile ? 'block' : 'none';
          if (this.mobile && this.cameraEl) {
            this.cameraEl.setAttribute('look-controls', 'enabled: false');
          } else if (this.cameraEl) {
            this.cameraEl.setAttribute('look-controls', 'enabled: true; pointerLockEnabled: true');
          }
        };
        window.addEventListener('resize', this.onResize);
      },
      buildUI: function () {
        this.ui = document.createElement('div');
        this.ui.id = 'mobile-controls';
        this.ui.innerHTML = '<div id="joystick-zone" aria-label="Movement joystick"><div id="joystick-knob"></div></div><div id="look-zone" aria-label="Swipe here to look around"></div><div id="look-hint">Swipe the right side to look around</div>';
        document.body.appendChild(this.ui);
        this.zone = this.ui.querySelector('#joystick-zone');
        this.lookZone = this.ui.querySelector('#look-zone');
        this.knob = this.ui.querySelector('#joystick-knob');

        this.zone.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          e.stopPropagation();
          this.joystickId = e.pointerId;
          if (this.zone.setPointerCapture) this.zone.setPointerCapture(e.pointerId);
          this.updateJoystick(e);
        });
        this.zone.addEventListener('pointermove', (e) => {
          if (e.pointerId === this.joystickId) {
            e.preventDefault();
            this.updateJoystick(e);
          }
        });
        const stopMove = (e) => {
          if (e.pointerId !== this.joystickId) return;
          this.joystickId = null;
          this.moveX = 0;
          this.moveY = 0;
          this.knob.style.transform = 'translate(0px, 0px)';
        };
        this.zone.addEventListener('pointerup', stopMove);
        this.zone.addEventListener('pointercancel', stopMove);
        this.zone.addEventListener('lostpointercapture', () => {
          this.joystickId = null; this.moveX = 0; this.moveY = 0;
          this.knob.style.transform = 'translate(0px, 0px)';
        });

        // Use the dedicated right-side surface so swipes are actually received.
        this.lookZone.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          this.lookId = e.pointerId;
          this.lastX = e.clientX;
          this.lastY = e.clientY;
          if (this.lookZone.setPointerCapture) this.lookZone.setPointerCapture(e.pointerId);
        });
        this.lookZone.addEventListener('pointermove', (e) => {
          if (e.pointerId !== this.lookId || !this.cameraEl) return;
          e.preventDefault();
          const dx = e.clientX - this.lastX;
          const dy = e.clientY - this.lastY;
          this.lastX = e.clientX;
          this.lastY = e.clientY;
          this.yaw -= dx * 0.004;
          this.pitch -= dy * 0.004;
          this.pitch = Math.max(-1.35, Math.min(1.35, this.pitch));
          this.cameraEl.object3D.rotation.order = 'YXZ';
          this.cameraEl.object3D.rotation.set(this.pitch, this.yaw, 0, 'YXZ');
        }, { passive: false });
        const stopLook = (e) => {
          if (e.pointerId === this.lookId) this.lookId = null;
        };
        this.lookZone.addEventListener('pointerup', stopLook);
        this.lookZone.addEventListener('pointercancel', stopLook);
        this.lookZone.addEventListener('lostpointercapture', stopLook);
      },
      updateJoystick: function (e) {
        const r = this.zone.getBoundingClientRect();
        let dx = e.clientX - (r.left + r.width / 2);
        let dy = e.clientY - (r.top + r.height / 2);
        const max = 40;
        const len = Math.hypot(dx, dy);
        if (len > max) { dx = dx / len * max; dy = dy / len * max; }
        this.moveX = dx / max;
        this.moveY = dy / max;
        this.knob.style.transform = 'translate(' + dx + 'px, ' + dy + 'px)';
      },
      tick: function (time, delta) {
        if (!this.mobile) return;
        const dt = Math.min(delta / 1000, 0.05);
        const p = this.rig.object3D.position;
        const forward = -this.moveY * this.data.speed * dt;
        const strafe = this.moveX * this.data.speed * dt;
        p.x += Math.sin(this.yaw) * forward + Math.cos(this.yaw) * strafe;
        p.z += -Math.cos(this.yaw) * forward + Math.sin(this.yaw) * strafe;
      },
      remove: function () {
        if (this.onResize) window.removeEventListener('resize', this.onResize);
        if (this.ui) this.ui.remove();
      }
    });

    window.addEventListener('error', function (e) {
      console.error('Villa page error:', e.message, e.filename, e.lineno);
    });
  </script>
</head>

<body>
  <div id="loading-note">Loading villa models…</div>

  <a-scene
    renderer="antialias: true; colorManagement: true"
    background="color: #101827"
    loading-screen="enabled: true"
    vr-mode-ui="enabled: true"
    embedded="false">

    <a-assets timeout="60000">
      <a-asset-item id="house-model" src="assets/villa_lisse_8_-_furniture_no_curtains.glb"></a-asset-item>
      <a-asset-item id="pool-model" src="assets/swimming_pool_1.glb"></a-asset-item>
      <a-asset-item id="garage-model" src="assets/industrial_garage.glb"></a-asset-item>
      <a-asset-item id="gym-1" src="assets/gym_equipment.glb"></a-asset-item>
      <a-asset-item id="pitch-model" src="assets/football_field_free.glb"></a-asset-item>
      <a-asset-item id="dog-model" src="assets/dog.glb"></a-asset-item>
      <a-asset-item id="cat-model" src="assets/cat.glb"></a-asset-item>
      <img id="sky-texture" src="assets/sky.jpg">
      <img id="land-texture" src="assets/grass.avif">
      <img id="water-texture" src="assets/water.jpg">
      <a-asset-item id="duck-model" src="assets/rubber_duck.glb"></a-asset-item>
      <a-asset-item id="car-model" src="assets/1940_ford_v8.glb"></a-asset-item>
      <a-asset-item id="pine-tree" src="assets/pine.glb"></a-asset-item>
      <a-asset-item id="bed-model" src="assets/bed_06.glb"></a-asset-item>
      <a-asset-item id="kitchen-model" src="assets/compact_bathroom_module.glb"></a-asset-item>
      <a-asset-item id="stairs-model" src="assets/round_stairs(1).glb"></a-asset-item>
      <a-asset-item id="tv-model" src="assets/grandmas_tv.glb"></a-asset-item>
    </a-assets>

    <!-- Global night lighting -->
    <a-light type="ambient" color="#0b1026" intensity="0.8"></a-light>
    <a-light type="directional" color="#cfd8ff" intensity="0.7" position="-30 40 20"></a-light>

    <!-- Main villa and warm exterior lighting -->
    <a-entity gltf-model="#house-model"
      position="-2.675 0.025 2.957" scale="2.234 3 2.550"
      shadow="cast: true; receive: true">
      <a-light type="spot" color="#ffcc88" intensity="2" position="-2 6 8"
        rotation="-60 0 0" angle="45" penumbra="0.4" distance="35"></a-light>
      <a-light type="spot" color="#ffcc88" intensity="2" position="4 6 8"
        rotation="-60 0 0" angle="45" penumbra="0.4" distance="35"></a-light>
      <a-light type="point" color="#fff4d1" intensity="3" distance="30" position="0 5 0"></a-light>
    </a-entity>

    <a-entity id="stairs" gltf-model="#stairs-model"
      position="28.746 -0.041 19.113" rotation="0 90 0" scale="4 3.4 2"></a-entity>

    <a-entity id="car" gltf-model="#car-model"
      position="30.879 0.05 36.828" rotation="0 320 0" scale="2 2 2"></a-entity>
    <a-light type="spot" position="29.347 16.051 35.049" rotation="-90 0 0"
      intensity="4" angle="35" penumbra="0.5" distance="20" color="#ffe6b3"></a-light>

    <!-- Pool, animated water and duck -->
    <a-entity gltf-model="#pool-model" position="35.354 1.592 -3.213"
      rotation="0 270 0" shadow="receive: true">
      <a-plane position="7.051 -0.087 -3.717" rotation="-90 0 0"
        width="18" height="10"
        material="src: #water-texture; repeat: 4 2; transparent: true; opacity: 0.9"
        animation="property: material.offset; to: 1 0; dur: 10000; loop: true; easing: linear"></a-plane>
      <a-entity gltf-model="#duck-model" position="10.596 0.278 -5.473"
        scale="0.25 0.25 0.25"
        animation="property: position; to: -2.101 -0.162 0.253; dur: 90000; dir: alternate; loop: true; easing: easeInOutSine"
        animation__rotation="property: rotation; to: -3 0.062 5; dur: 8000; dir: alternate; loop: true; easing: easeInOutSine"></a-entity>
      <a-light type="point" color="#00d4ff" intensity="5" distance="20"
        position="0 1 0"></a-light>
    </a-entity>

    <!-- Interior objects -->
    <a-entity id="bed" gltf-model="#bed-model" position="-2.545 10.696 2.257"
      scale="18 23 23" rotation="0 90 0"></a-entity>
    <a-entity id="BATHROOM" gltf-model="#kitchen-model" position="8.725 10.479 9.87"
      scale="5 3 3.6" rotation="0 180 0"></a-entity>
    <a-entity gltf-model="#garage-model" position="-12.326 -14.078 8.272"
      scale="2.5 3.659 2.303" rotation="0 90 0"></a-entity>
    <a-entity gltf-model="#gym-1" position="-32.482 0.460 29.541"
      scale="0.98 1 0.77" rotation="0 180 0" shadow="cast: true"></a-entity>
    <a-entity id="pitch" gltf-model="#pitch-model" position="44.377 0.504 -37.612"
      scale="2 1.5 1.5" shadow="receive: true"></a-entity>

    <!-- Pets -->
    <a-entity gltf-model="#cat-model" position="5.418 1.438 16.407"
      scale="3 3 3" rotation="0 90 0"
      animation="property: scale; from: 3 3 3; to: 3.05 3.1 3.05; dur: 4000; dir: alternate; loop: true"></a-entity>
    <a-entity gltf-model="#dog-model" position="23.418 1.190 14.234"
      scale="4.3 4.3 4.3" rotation="0 -30 0"
      animation="property: scale; from: 4.3 4.3 4.3; to: 4.35 4.4 4.35; dur: 4000; dir: alternate; loop: true"></a-entity>

    <!-- Trees -->
    <a-entity id="forest" gltf-model="#pine-tree" position="56.440 2.103 -67.061" scale="3 3 3"></a-entity>
    <a-entity gltf-model="#pine-tree" position="-64.952 0.05 17.728" scale="3 3 3"></a-entity>
    <a-entity gltf-model="#pine-tree" position="67.282 0.050 30.650" scale="3 3 3"></a-entity>
    <a-entity gltf-model="#pine-tree" position="-52.025 2.173 -63.976" scale="3 3 3"></a-entity>

    <!-- TV room -->
    <a-entity id="TV" gltf-model="#tv-model" position="18.178 10.835 10.247"
      scale="0.010 0.010 0.010" rotation="0 270 0"></a-entity>

    <!-- Ground and sky -->
    <a-plane position="0 0 0" rotation="-90 0 0" width="150" height="150"
      src="#land-texture" repeat="20 20" shadow="receive: true"></a-plane>
    <a-sky src="#sky-texture" material="color: #666677" rotation="0 -90 0"></a-sky>

    <!-- Upstairs teleport pad -->
    <a-entity id="teleport1" position="27.639 0.05 20.972">
      <a-text value="GO UPSTAIRS" align="center" color="#ffffff" position="0 2.3 0"
        scale="1.5 1.5 1.5"
        animation="property: position; dir: alternate; dur: 1000; loop: true; to: 0 2.6 0"></a-text>
      <a-ring radius-inner="0.5" radius-outer="0.8" rotation="-90 0 0" color="#00f2ff"
        material="shader: standard; emissive: #00f2ff; emissiveIntensity: 2; transparent: true; opacity: 0.9"
        animation="property: rotation; to: -90 360 0; loop: true; dur: 4000; easing: linear"></a-ring>
      <a-circle radius="0.45" rotation="-90 0 0" color="#00f2ff"
        material="transparent: true; opacity: 0.6"
        animation="property: scale; to: 1.2 1.2 1.2; dir: alternate; loop: true; dur: 800"></a-circle>
      <a-cone position="0 0.6 0" radius-bottom="0.2" radius-top="0" height="0.4" color="#ffffff"
        animation="property: position; dir: alternate; dur: 1000; loop: true; to: 0 0.8 0"></a-cone>
      <a-cylinder radius="0.8" height="0.2" material="opacity: 0; transparent: true"
        smooth-teleport="to: 24.528 12.811 12.384"
        animation__enter="property: scale; startEvents: mouseenter; to: 1.2 1 1.2; dur: 200"
        animation__leave="property: scale; startEvents: mouseleave; to: 1 1 1; dur: 200"></a-cylinder>
    </a-entity>

    <!-- Downstairs teleport pad -->
    <a-entity id="teleport2" position="24.538 12.811 12.384">
      <a-text value="GO DOWNSTAIRS" align="center" color="#ffffff" position="0 2.3 0"
        scale="1.5 1.5 1.5"
        animation="property: position; dir: alternate; dur: 1000; loop: true; to: 0 2.6 0"></a-text>
      <a-ring radius-inner="0.5" radius-outer="0.8" rotation="-90 0 0" color="#ff9800"
        material="shader: standard; emissive: #ff9800; emissiveIntensity: 2; transparent: true; opacity: 0.9"
        animation="property: rotation; to: -90 360 0; loop: true; dur: 4000; easing: linear"></a-ring>
      <a-circle radius="0.45" rotation="-90 0 0" color="#ff9800"
        material="transparent: true; opacity: 0.6"
        animation="property: scale; to: 1.2 1.2 1.2; dir: alternate; loop: true; dur: 800"></a-circle>
      <a-cone position="0 0.6 0" radius-bottom="0.2" radius-top="0" height="0.4"
        rotation="180 0 0" color="#ffffff"
        animation="property: position; dir: alternate; dur: 1000; loop: true; to: 0 0.8 0"></a-cone>
      <a-cylinder radius="0.8" height="0.2" material="opacity: 0; transparent: true"
        smooth-teleport="to: 27.639 0.05 20.972"
        animation__enter="property: scale; startEvents: mouseenter; to: 1.2 1 1.2; dur: 200"
        animation__leave="property: scale; startEvents: mouseleave; to: 1 1 1; dur: 200"></a-cylinder>
    </a-entity>

    <!-- Player rig: desktop controls remain available; mobile uses touch joystick -->
    <a-entity id="rig" position="20.393 3.008 55.157"
      movement-controls="speed: 0.25" villa-mobile-controls="speed: 5">
      <a-entity id="camera" camera position="0 1.6 0"
        look-controls="pointerLockEnabled: true">
        <a-cursor color="#FFD700" fuse="false"></a-cursor>
      </a-entity>
      <a-plane id="fade" position="0 0 -0.5" width="1" height="1" color="black"
        material="opacity: 0; transparent: true"></a-plane>
    </a-entity>
  </a-scene>

  <script>
    const scene = document.querySelector('a-scene');
    const note = document.querySelector('#loading-note');
    scene.addEventListener('loaded', () => {
      note.textContent = 'Villa loaded · left joystick to move · swipe right side to look';
      window.setTimeout(() => note && note.remove(), 6000);
    });
    scene.addEventListener('loaded', () => {
      document.querySelectorAll('[gltf-model]').forEach((el) => {
        el.addEventListener('model-error', (event) => {
          console.error('A 3D model failed to load:', el.getAttribute('gltf-model'), event);
        });
      });
    });
  </script>
</body>
</html>
