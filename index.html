  <script>
    AFRAME.registerComponent('smooth-teleport', {
      schema: {to: {type: 'vec3'}},
    
      init: function () {
        this.el.addEventListener('click', () => {
          const rig = document.querySelector('#rig');
          const fade = document.querySelector('#fade');
    
          // Fade to black
          fade.setAttribute('animation', {
            property: 'material.opacity',
            to: 1,
            dur: 200
          });
    
          setTimeout(() => {
            rig.setAttribute('position', this.data.to);
    
            // Fade back
            fade.setAttribute('animation', {
              property: 'material.opacity',
              to: 0,
              dur: 200
            });
          }, 200);
        });
      }
    });
    </script>
    <script>
      AFRAME.registerComponent('auto-teleport', {
        schema: {to: {type: 'vec3'}},
      
        tick: function () {
          const rig = document.querySelector('#rig');
          const rigPos = rig.object3D.position;
          const triggerPos = this.el.object3D.position;
      
          const distance = rigPos.distanceTo(triggerPos);
      
          if (distance < 1.5) {
            rig.setAttribute('position', this.data.to);
          }
        }
      });
      </script>
